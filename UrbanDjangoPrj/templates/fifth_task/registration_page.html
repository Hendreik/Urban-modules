<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms</title>
</head>
<body>
<h1>Форма ввода. html</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <label for="username">Введите логин</label>
        <input type="text" id="uname" name="uname" maxlength="30" required>

        <label for="password">Введите пароль</label>
        <input type="text" id="pwd" name="pwd" minlength="8" required>

        <label for="repeat_password">Повторите пароль</label>
        <input type="text" id="r_password" name="rpwd" minlength="8" required>

        <label for="age">Введите свой возраст</label>
        <input type="text" id="age" name="age_" maxlength="3" required>

        <button type="submit">send</button>
    </form>

</body>
</html>
